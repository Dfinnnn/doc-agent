<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <svg class="logo" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z M15 3v3h3 M9 11h6 M9 15h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <h1>Work journal</h1>
    <span id="files-mode" class="mode">…</span>
    <span class="doc">Work log · Google Sheet</span>
    <span class="doc">Logbook · <span id="logbook-file">…</span></span>
    <span class="grow"></span>
    <span class="muted"><span id="model">…</span> · <span id="status">connecting</span></span>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Chat">
      <p id="today" class="day"></p>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="chat-form" class="composer">
        <div class="composer-row">
          <label for="chat-input" class="sr-only">Your order</label>
          <textarea id="chat-input" rows="2" placeholder="Write an order, e.g. log update 05/11: …"></textarea>
          <button type="submit" id="send" class="primary">Send</button>
        </div>
        <p class="examples">
          <button type="button" class="link chip" data-text="log update ">log update</button> ·
          <button type="button" class="link chip" data-text="sync the Sheet to the logbook">sync</button> ·
          <button type="button" class="link chip" data-text="audit both documents">audit</button> ·
          <button type="button" class="link chip" data-text="summarize this month">summarize</button>
        </p>
      </form>
    </section>

    <section class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-preview" aria-controls="panel-preview" aria-selected="true">Preview</button>
        <button role="tab" id="tab-activity" aria-controls="panel-activity" aria-selected="false" tabindex="-1">Activity</button>
      </div>
      <div id="panel-preview" role="tabpanel" aria-labelledby="tab-preview" class="panel"></div>
      <div id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" class="panel" hidden></div>
    </section>
  </main>

  <dialog id="undo-dialog" aria-labelledby="undo-title">
    <form method="dialog" class="undo-form">
      <h2 id="undo-title">Undo changes?</h2>
      <p class="muted">Each goes back to its value before the write.</p>
      <ul id="undo-list" class="undo-list"></ul>
      <p id="undo-error" class="action-error" hidden></p>
      <div class="action-right">
        <button value="cancel">Cancel</button>
        <button type="button" id="undo-confirm" class="primary">Undo</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
